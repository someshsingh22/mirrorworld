# Test Interview Agent Configuration (Short version)

# Agent behavior
agent:
  max_steps: 3  # Only 3 questions for testing
  max_history: 2  # Number of previous Q&As to include in context
  planning: true  # Enable strategic planning before questions (plan-then-question workflow)
  verbosity: true  # Show persona_estimate after each question (true) or only at end (false)

# LLM configuration
llm:
  model: "gpt-4.1"
  deployment_name: "gpt-4.1"  # Azure deployment name (can be same as model)
  temperature: 0.7

# Initial state
initial_state:
  persona_estimate: ""  # Empty initial persona (text description)
  qna_history: []  # No history at start
  plan: ""
  target_task: "Identify the user's visual preferences, interests about images, art, design, and style, however you cannot ask about these topics directly, you need to infer their persona outside of these topics"  # Objective the interview should accomplish, derived from persona
  steps_completed: 0

# Run metadata (copied verbatim into trajectory logs)
metadata:
  campaign: "test"
  persona_goal: "visual_inference"

